# Local development configuration for the Supabase CLI.
# The deployed project is linked separately with:
#   supabase link --project-ref htqqvhxgkqzxcbzcnlzd
project_id = "icthus"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Magic link is the web MVP path; passwords are deliberately not used.
secure_password_change = true

[auth.sms]
enable_signup = false

# Edge Functions. verify_jwt is false for the scheduled jobs because they are
# invoked by pg_cron rather than a signed-in person — they authenticate with
# ICTHUS_SCHEDULER_SECRET instead, which the function checks on every request.
[functions.account-delete]
verify_jwt = true

[functions.asset-upload-url]
verify_jwt = true

[functions.delivery-dispatch]
verify_jwt = false

[functions.daily-companion-run]
verify_jwt = false
